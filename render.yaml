services:
  # Backend — FastAPI (Docker)
  - type: web
    name: mjcc-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: CORS_ORIGINS
        value: "*"
      - key: GITHUB_REPO
        value: MJCC-Portal/mjcc
      - key: GROQ_MODEL
        value: mixtral-8x7b-32768
      - key: AI_MODEL
        value: llama3.2:3b
      - key: AI_PROVIDER
        value: ollama
      # Secrets — set values in Render dashboard
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_MCP_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

  # Frontend — Vite static site
  - type: web
    name: mjcc
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://mjcc-managements.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
