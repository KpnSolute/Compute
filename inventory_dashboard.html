<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/logo-shield.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miami Job Corps Cafeteria — Inventory Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/JsBarcode/3.11.5/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;font-size:13px;background:#F5F6F8;color:#1E293B}
#header{background:#1A2B4A;color:white;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:36px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.logo-icon img{width:100%;height:100%;object-fit:contain}
.hd-title{font-size:14px;font-weight:700;line-height:1.2}
.hd-sub{font-size:10px;opacity:.7}
.hd-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#header select{font-size:12px;padding:4px 8px;border-radius:5px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:white;cursor:pointer}
#header select option{background:#1A2B4A}
.btn-hdr{padding:6px 12px;border-radius:5px;border:1px solid rgba(255,255,255,.3);background:transparent;color:white;cursor:pointer;font-size:12px;font-family:inherit}
.btn-hdr:hover{background:rgba(255,255,255,.15)}
.inv-badge{background:#166534;color:#BBF7D0;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap}
/* ── Barcodes ── */
.label-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:16px}
.label-card{border:1px solid #E2E8F0;border-radius:8px;padding:10px;text-align:center;background:white;break-inside:avoid}
.label-card .lbl-cat{font-size:9px;color:#64748B;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.label-card .lbl-desc{font-size:10px;font-weight:700;line-height:1.3;margin-bottom:5px;min-height:28px}
.label-card .lbl-code{font-size:9px;font-family:'Courier New',monospace;color:#94A3B8;margin-top:3px}
.label-card .lbl-price{font-size:9px;color:#059669;margin-top:2px;font-weight:600}
.label-card svg{max-height:55px;width:100%}
/* ── Scanner modal ── */
.scan-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:2000;display:flex;align-items:center;justify-content:center}
.scan-box{background:white;border-radius:12px;padding:20px;max-width:420px;width:92%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.scan-box h3{font-size:15px;font-weight:700;margin-bottom:4px}
.scan-box .scan-sub{font-size:11px;color:#64748B;margin-bottom:14px}
.qty-row{display:flex;align-items:center;justify-content:center;gap:10px}
.qty-btn{width:32px;height:32px;border-radius:50%;border:1px solid #E2E8F0;background:#F8FAFC;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;color:#1E293B}
.qty-btn:hover{background:#E2E8F0}
.qty-val{font-size:22px;font-weight:700;min-width:40px;text-align:center}
/* ── Camera modal ── */
#cam-video{width:100%;border-radius:8px;background:#000;max-height:300px;object-fit:cover}
.cam-guide{position:relative;overflow:hidden;border-radius:8px}
.cam-guide::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:60%;height:40%;border:3px solid rgba(5,150,105,.8);border-radius:6px;box-shadow:0 0 0 100vmax rgba(0,0,0,.4)}
/* ── Scan mode active bar ── */
#scan-active-bar{display:none;background:#059669;color:white;text-align:center;padding:7px;font-weight:700;font-size:12px;position:sticky;top:0;z-index:100}

/* ── Cloud Sync ── */
.sync-badge{cursor:pointer;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;color:white;transition:background .3s;white-space:nowrap}
.sync-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:3000;display:flex;align-items:center;justify-content:center}
.sync-setup-box{background:white;border-radius:14px;padding:22px;max-width:540px;width:94%;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.step-block{background:#F0F9FF;border:1px solid #BAE6FD;border-radius:8px;padding:12px;margin-bottom:14px;font-size:11px;line-height:1.8}
.step-block code{background:#DBEAFE;padding:1px 5px;border-radius:3px;font-family:'Courier New',monospace}
.sync-url-inp{width:100%;padding:9px;border:1.5px solid #E2E8F0;border-radius:6px;font-size:12px;font-family:'Courier New',monospace;margin-top:5px}
.sync-url-inp:focus{outline:none;border-color:#1A2B4A}
.sync-status-card{background:#F8FAFC;border-radius:8px;padding:10px 12px;font-size:11px;margin-bottom:12px;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.realtime-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;animation:rtpulse 1.5s infinite}
@keyframes rtpulse{0%,100%{opacity:1}50%{opacity:.2}}

@media print{
  .no-print,#scan-active-bar,#header .hd-right{display:none!important}
  .label-card{border:1px solid #999;page-break-inside:avoid}
  .label-grid{grid-template-columns:repeat(4,1fr)}
  body{background:white}#page{max-width:100%;padding:0}
}
#tabs{background:white;border-bottom:1px solid #E2E8F0;display:flex;overflow-x:auto}
.tab{padding:10px 16px;border:none;background:transparent;cursor:pointer;font-size:12px;color:#64748B;border-bottom:2px solid transparent;white-space:nowrap;font-family:inherit}
.tab.active{color:#1E293B;border-bottom-color:#1A2B4A;font-weight:700}
.tab:hover{color:#1E293B;background:#F8FAFC}
#page{padding:16px;max-width:1160px;margin:0 auto}
.pg{display:none}.pg.active{display:block}
.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.stat-card{background:white;border-radius:8px;padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stat-lbl{font-size:10px;color:#64748B;margin-bottom:4px}
.stat-val{font-size:22px;font-weight:700;font-family:'Courier New',monospace}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:18px}
.cat-card{background:white;border-radius:8px;padding:10px 13px;box-shadow:0 1px 3px rgba(0,0,0,.06);border-left:4px solid #ccc}
.cat-name{font-weight:700;font-size:12px;margin-bottom:5px}
.cat-val{font-size:17px;font-weight:700;font-family:'Courier New',monospace}
.cat-sub{font-size:10px;color:#64748B;margin-top:2px}
.section{background:white;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:12px;overflow:hidden}
.sec-head{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;cursor:pointer;border-bottom:1px solid #F1F5F9;background:#F8FAFC;user-select:none}
.sec-head:hover{background:#F1F5F9}
.sh-l{display:flex;align-items:center;gap:8px}
.sh-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.sh-ttl{font-weight:700;font-size:12px}
.sh-cnt{font-size:10px;color:#94A3B8}
.sh-badge{background:#DCFCE7;color:#166534;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700}
.sh-tot{font-family:'Courier New',monospace;font-weight:700;font-size:12px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:11px}
thead tr{background:#F8FAFC}
th{padding:5px 6px;text-align:center;font-weight:700;color:#64748B;border-bottom:1px solid #E2E8F0;white-space:nowrap;font-size:10px}
th.tl,td.tl{text-align:left}
td{padding:4px 5px;border-bottom:1px solid #F1F5F9;text-align:center;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFBFC}
tr.rcvd td{background:#F0FDF4}
tr.rcvd:hover td{background:#DCFCE7}
tfoot td{background:#F8FAFC;font-weight:700;border-top:1px solid #E2E8F0;border-bottom:none;font-size:11px}
.num{font-family:'Courier New',monospace}
.inp{width:44px;border:1px solid #E2E8F0;border-radius:4px;padding:2px 4px;font-size:11px;text-align:center;font-family:'Courier New',monospace;background:#F8FAFC;color:#1E293B}
.inp:focus{outline:none;border-color:#1A2B4A;background:white}
.inp-w{width:60px}
.inp-desc{width:100%;border:none;background:transparent;font-size:11px;color:#1E293B;font-family:inherit}
.inp-desc:focus{outline:none}
.inp-ro{color:#D97706;font-weight:700}
.inp-gr{color:#059669}
.btn-del{border:none;background:none;cursor:pointer;color:#CBD5E1;font-size:12px;padding:2px 4px;line-height:1}
.btn-del:hover{color:#EF4444}
.btn-add{border:1px dashed #CBD5E1;background:none;border-radius:5px;padding:3px 9px;cursor:pointer;font-size:10px;color:#94A3B8;font-family:inherit}
.btn-add:hover{color:#1E293B;border-color:#94A3B8}
.b-ok{background:#D1FAE5;color:#065F46;padding:1px 6px;border-radius:3px;font-size:9px;font-weight:700}
.b-ro{background:#FEF3C7;color:#92400E;padding:1px 6px;border-radius:3px;font-size:9px;font-weight:700}
.alert-g{background:#F0FDF4;border:1px solid #BBF7D0;border-radius:8px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:flex-start;gap:10px}
.alert-g .ic{font-size:16px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;width:20px}
.icon-btn{display:inline-flex;align-items:center;gap:6px}
.alert-g .at{font-weight:700;color:#15803D;font-size:12px}
.alert-g .as{font-size:10px;color:#166534;margin-top:2px}
.alert-a{background:#FFFBEB;border:1px solid #FDE68A;border-radius:8px;padding:10px 14px;margin-bottom:14px}
.sec-lbl{font-weight:700;margin-bottom:10px;font-size:13px}
textarea{width:100%;min-height:180px;padding:10px;font-size:12px;font-family:'Courier New',monospace;border:1px solid #E2E8F0;border-radius:8px;resize:vertical;background:#F8FAFC;color:#1E293B}
textarea:focus{outline:none;border-color:#1A2B4A}
.btn-p{padding:7px 16px;border-radius:6px;border:none;background:#1A2B4A;color:white;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit}
.btn-p:hover{background:#243B66}
.btn-p:disabled{opacity:.5;cursor:not-allowed}
.btn-s{padding:7px 14px;border-radius:6px;border:1px solid #E2E8F0;background:white;color:#1E293B;cursor:pointer;font-size:12px;font-family:inherit}
.btn-s:hover{background:#F1F5F9}
.btn-g{padding:7px 14px;border-radius:6px;border:none;background:#059669;color:white;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit}
.btn-g:hover{background:#047857}
.grand-bar{display:flex;justify-content:flex-end;padding:10px 0;border-top:1px solid #E2E8F0;font-family:'Courier New',monospace;font-weight:700;font-size:14px}
.rpt{background:white;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:22px}
#toast{position:fixed;bottom:20px;right:20px;background:#059669;color:white;padding:10px 18px;border-radius:8px;font-weight:700;z-index:9999;font-size:12px;display:none;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.hist-table{width:100%;border-collapse:collapse;font-size:11px}
.hist-table th{padding:7px 10px;text-align:left;font-weight:700;color:#64748B;border-bottom:2px solid #E2E8F0;font-size:10px;white-space:nowrap;background:#F8FAFC}
.hist-table th.tr{text-align:right}
.hist-table td{padding:7px 10px;border-bottom:1px solid #F1F5F9;vertical-align:middle}
.hist-table td.tr{text-align:right;font-family:'Courier New',monospace;font-weight:700}
.hist-table tr:hover td{background:#F8FAFC}
.bar-wrap{height:8px;background:#F1F5F9;border-radius:4px;overflow:hidden;min-width:80px}
.bar-fill{height:100%;border-radius:4px;transition:width .4s}
.month-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;background:#EFF6FF;color:#1D4ED8}
.trend-up{color:#059669;font-size:10px}
.trend-dn{color:#DC2626;font-size:10px}
.trend-eq{color:#94A3B8;font-size:10px}
.hist-cat-chip{display:inline-block;padding:2px 6px;border-radius:4px;font-size:9px;font-weight:700;margin:1px;color:white}
.compare-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:16px}
.compare-card{background:white;border-radius:8px;padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.compare-card .lbl{font-size:10px;color:#64748B;margin-bottom:4px}
.compare-card .val{font-size:18px;font-weight:700;font-family:'Courier New',monospace}
.compare-card .delta{font-size:11px;margin-top:3px}
.btn-save{padding:6px 12px;border-radius:5px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.15);color:white;cursor:pointer;font-size:12px;font-family:inherit;font-weight:700}
.btn-save:hover{background:rgba(255,255,255,.25)}

/* ── Cloud Sync ── */
.sync-badge{cursor:pointer;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;color:white;transition:background .3s;white-space:nowrap}
.sync-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:3000;display:flex;align-items:center;justify-content:center}
.sync-setup-box{background:white;border-radius:14px;padding:22px;max-width:540px;width:94%;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.step-block{background:#F0F9FF;border:1px solid #BAE6FD;border-radius:8px;padding:12px;margin-bottom:14px;font-size:11px;line-height:1.8}
.step-block code{background:#DBEAFE;padding:1px 5px;border-radius:3px;font-family:'Courier New',monospace}
.sync-url-inp{width:100%;padding:9px;border:1.5px solid #E2E8F0;border-radius:6px;font-size:12px;font-family:'Courier New',monospace;margin-top:5px}
.sync-url-inp:focus{outline:none;border-color:#1A2B4A}
.sync-status-card{background:#F8FAFC;border-radius:8px;padding:10px 12px;font-size:11px;margin-bottom:12px;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.realtime-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;animation:rtpulse 1.5s infinite}
@keyframes rtpulse{0%,100%{opacity:1}50%{opacity:.2}}

@media print{
  #header .hd-right,#tabs,.btn-hdr,.btn-del,.btn-add,.no-print,#toast{display:none!important}
  body{background:white;font-size:10px}#page{padding:0;max-width:100%}
  .section{box-shadow:none;border:1px solid #ccc;border-radius:0;margin-bottom:6px}
  .rpt{box-shadow:none;border-radius:0}
  .stat-card,.cat-card{border:1px solid #ccc;border-radius:0}.stat-val{font-size:16px}.cat-val{font-size:14px}
  .card-grid,.cat-grid{gap:4px}td,th{padding:3px 4px;font-size:9px}
}

.modal-overlay.hidden{display:none;}
.modal-box{
  background:#fff;border-radius:16px;width:min(520px,95vw);
  max-height:90vh;overflow-y:auto;
  box-shadow:0 24px 80px rgba(0,0,0,0.3);
}
.modal-head{
  padding:18px 20px;border-bottom:1px solid #E2E8F0;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;background:#fff;border-radius:16px 16px 0 0;
}
.modal-head h3{margin:0;font-size:15px;font-weight:700;}
.modal-body{padding:18px 20px;}
.user-row{
  display:grid;grid-template-columns:1fr 80px 80px 80px;align-items:center;
  gap:8px;padding:10px 0;border-bottom:1px solid #F1F5F9;font-size:12px;
}
.user-row:last-child{border:none;}
.badge-role{
  padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.5px;
}
.badge-role.admin{background:#FEF3C7;color:#92400E;}
.badge-role.manager{background:#DBEAFE;color:#1E40AF;}
.badge-role.staff{background:#D1FAE5;color:#065F46;}

</style>
</head>
<body>
<div id="header">
  <div class="logo">
    <div class="logo-icon"><img src="/logo-shield.svg" alt="MJC Shield"></div>
    <div>
      <div class="hd-title">Miami Job Corps Cafeteria</div>
      <div class="hd-sub" id="sync-status">Inventory Management System</div>
    </div>
  </div>
  <div class="hd-right">
    <span class="inv-badge"><i class="fas fa-check"></i> US Foods #2312098 — Wk1</span><span class="inv-badge" style="background:#1D4ED8"><i class="fas fa-check"></i> Multi-Flow #861848 #864172 #864236 — Wk1</span>
    <select id="selMonth" onchange="renderActive()">
      <option value="0">January</option><option value="1">February</option><option value="2">March</option>
      <option value="3">April</option><option value="4" selected>May</option><option value="5">June</option>
      <option value="6">July</option><option value="7">August</option><option value="8">September</option>
      <option value="9">October</option><option value="10">November</option><option value="11">December</option>
    </select>
    <select id="selYear" onchange="renderActive()">
      <option>2024</option><option>2025</option><option selected>2026</option><option>2027</option>
    </select>
    <button class="btn-save icon-btn" onclick="exportData()" title="Export inventory data"><i class="fas fa-download"></i> Export</button>
    <label class="btn-save icon-btn" style="cursor:pointer" title="Import previously exported data"><i class="fas fa-upload"></i> Import<input type="file" accept=".json" onchange="importData(event)" style="display:none"></label>
    <button class="btn-save icon-btn" onclick="saveSnapshot()" title="Save current month snapshot"><i class="fas fa-floppy-disk"></i> Save</button>
    <button class="btn-save icon-btn" id="btn-rollover" onclick="rollToNextMonth()" style="background:linear-gradient(135deg,#059669,#0d9488);color:#fff;border-color:#059669" title="Close current month and roll inventory forward to next month"><i class="fas fa-calendar-check"></i> Close Month</button>
    <button id="scan-btn" class="btn-save icon-btn" onclick="toggleScanMode()" title="Activate barcode scanner"><i class="fas fa-barcode"></i> Scan</button>
    <button class="btn-hdr icon-btn" onclick="openCameraScan()" title="Scan barcodes with camera (Chrome/Android)"><i class="fas fa-camera"></i> Camera</button>
    <button class="btn-hdr icon-btn" onclick="window.print()"><i class="fas fa-print"></i> Print</button>
    <button class="btn-hdr icon-btn" onclick="(function(){try{sessionStorage.removeItem('mjc_auth');}catch(e){}window.location.replace('index.html');})()" title="Sign out" style="background:rgba(220,38,38,.2);border-color:rgba(220,38,38,.4)"><i class="fas fa-sign-out-alt"></i> Sign Out</button>
  </div>
</div>
<div id="scan-active-bar"><i class="fas fa-barcode" style="margin-right:8px"></i>SCANNER ACTIVE — Scan any barcode to update inventory · Click <a href="#" onclick="toggleScanMode();return false" style="color:white;font-weight:900">STOP</a> to exit</div>

<div id="tabs">
  <button class="tab active icon-btn" onclick="showTab('dashboard',this)"><i class="fas fa-chart-line"></i> Dashboard</button>
  <button class="tab icon-btn" onclick="showTab('inventory',this)"><i class="fas fa-list"></i> Inventory</button>
  <button class="tab icon-btn" onclick="showTab('invoice',this)"><i class="fas fa-receipt"></i> Invoices</button>
  <button class="tab icon-btn" onclick="showTab('report',this)"><i class="fas fa-file-alt"></i> Report</button>
  <button class="tab icon-btn" onclick="showTab('pullsheet',this)"><i class="fas fa-clipboard-list"></i> Pull Sheet</button>
  <button class="tab icon-btn" onclick="showTab('history',this)"><i class="fas fa-history"></i> History</button>
  <button class="tab icon-btn" onclick="showTab('barcodes',this)"><i class="fas fa-box"></i> Barcodes</button>
  <button class="tab icon-btn" onclick="showTab('mobile',this)"><i class="fas fa-mobile-alt"></i> Mobile</button>
</div>

<div id="page">
  <div id="pg-dashboard" class="pg active"></div>
  <div id="pg-inventory" class="pg"></div>
  <div id="pg-invoice" class="pg"></div>
  <div id="pg-report" class="pg"></div>
  <div id="pg-pullsheet" class="pg"></div>
  <div id="pg-history" class="pg"></div>
  <div id="pg-barcodes" class="pg"></div>
  <div id="pg-mobile" class="pg"></div>
</div>
<div id="toast"><i class="fas fa-check"></i> Applied to inventory</div>

<script>
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];

function $f(n){return"$"+n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",")}
function num(v){const n=parseFloat(v);return isNaN(n)?0:Math.max(0,n)}
function iTotal(it){return Math.max(0,it.onHand+(it.w1r+it.w2r+it.w3r+it.w4r)-(it.w1i+it.w2i+it.w3i+it.w4i))*it.price}
function allItems(){return Object.values(INV).flat()}
function grandTotal(){return allItems().reduce((s,i)=>s+iTotal(i),0)}
function catTotal(c){return INV[c].reduce((s,i)=>s+iTotal(i),0)}
function wk1Total(){return allItems().reduce((s,i)=>s+i.w1r*i.price,0)}
function wk2Total(){return allItems().reduce((s,i)=>s+i.w2r*i.price,0)}
function wk3Total(){return allItems().reduce((s,i)=>s+i.w3r*i.price,0)}
function wk4Total(){return allItems().reduce((s,i)=>s+i.w4r*i.price,0)}
function startingTotal(){
  // Starting value = previous month's grandTotal from history (exact match).
  // After a rollover, the new onHand values ARE the previous month's ending values,
  // so sum(onHand×price) also gives the correct answer for rolled months.
  const m=+document.getElementById('selMonth').value;
  const y=+document.getElementById('selYear').value;
  let pm=m-1,py=y;
  if(pm<0){pm=11;py--;}
  const prev=getHistory().find(h=>h.month===pm&&h.year===py);
  if(prev&&prev.grandTotal) return prev.grandTotal;
  // Fallback: sum onHand×price (correct after rollover since onHand = prior ending)
  return allItems().reduce((s,i)=>s+i.onHand*i.price,0);
}
function reorders(){return allItems().filter(i=>i.onHand<i.par&&i.par>0)}

// Returns HIST_DATA record for the selected month, or null if it's the live month (May 2026)
function getMonthContext(){
  const m=+document.getElementById('selMonth').value;
  const y=+document.getElementById('selYear').value;
  if(m===4&&y===2026)return null; // live editable month
  // Return historical data from server-loaded preset
  return HIST_DATA.find(h=>h.month===m&&h.year===y)||null;
}

const BCAT={Dairy:'DAR',Cereal:'CER',Beverages:'BEV',Snacks:'SNK',
  'Dry Goods':'DRY','Produce & Fresh':'PRD','Protein & Meat':'PRT',
  'Frozen Foods':'FRZ',Supplies:'SUP'};

function getBarcodeId(it,cat,gIdx){
  if(it.sku&&it.sku.trim()&&it.sku.length>3)return it.sku.trim().replace(/\s/g,'');
  const abbr=BCAT[cat]||cat.replace(/[^A-Z]/gi,'').substring(0,3).toUpperCase();
  return'MJC'+abbr+String(gIdx+1).padStart(4,'0');
}

// Build a flat map: barcodeId → {item, cat}
function buildBarcodeMap(){
  const map={};
  let g=0;
  for(const[cat,items]of Object.entries(INV)){
    items.forEach(it=>{
      const bc=getBarcodeId(it,cat,g);
      map[bc]={it,cat};g++;
    });
  }
  return map;
}

function renderBarcodes(){
  const filterCat=(document.getElementById('bcat-filter')||{value:''}).value||'';

      <button class="btn-s icon-btn no-print" onclick="toggleScanMode()"><i class="fas fa-barcode"></i> Scan Mode</button>
    </div>
  </div>`;
  let g=0;
  const bcIds=[];
  Object.entries(INV).forEach(([cat,items])=>{
    const startG=g;
    if(filterCat&&cat!==filterCat){g+=items.length;return;}
    h+=`<div style="margin-bottom:16px">
      <div style="font-weight:700;font-size:11px;color:${CCOLOR[cat]||'#888'};border-bottom:2px solid ${CCOLOR[cat]||'#888'};padding-bottom:4px;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px">${cat} (${items.length} items)</div>
      <div class="label-grid">`;
    items.forEach((it,i)=>{
      const gIdx=startG+i;
      const bc=getBarcodeId(it,cat,gIdx);
      bcIds.push({id:it.id,bc});
      h+=`<div class="label-card">
        <div class="lbl-cat">${cat}</div>
        <div class="lbl-desc">${it.desc.replace(/"/g,'&quot;').substring(0,42)}</div>

        <div class="lbl-code">${bc}</div>
        <div class="lbl-price">${$f(it.price)}/unit &nbsp;·&nbsp; OH: ${it.onHand}</div>
      </div>`;
      g++;
    });
    h+=`</div></div>`;
  });
  h+=`<div style="margin-top:8px;padding:10px;background:#F8FAFC;border-radius:6px;font-size:11px;color:#64748B">
    <strong>Total: ${g} barcodes generated.</strong> Green-dot codes use your existing SKU. MJC-prefixed codes are system-generated.
    USB/Bluetooth HID scanners work automatically — just click <strong><i class="fas fa-barcode"></i> Scan Mode</strong> and scan.
  </div>`;
  document.getElementById('pg-barcodes').innerHTML=h;
  // Render barcodes after DOM settles
  setTimeout(()=>{
    bcIds.forEach(({id,bc})=>{
      const el=document.getElementById('bc-'+id);
      if(!el)return;
      try{
        JsBarcode(el,bc,{format:'CODE128',width:1.5,height:48,displayValue:false,margin:3,background:'#ffffff',lineColor:'#000000'});
      }catch(e){el.innerHTML=`<text x="50%" y="50%" font-size="8" text-anchor="middle">${bc}</text>`;}
    });
  },50);
}

══════════════════════════════════════════════════════ */
let _scanActive=false,_scanBuf='',_scanTimer=null,_lastKeyTime=0;

function toggleScanMode(){
  _scanActive=!_scanActive;
  const btn=document.getElementById('scan-btn');
  const bar=document.getElementById('scan-active-bar');
  if(_scanActive){
    btn.style.background='#059669';btn.textContent='';btn.innerHTML='<i class="fas fa-stop-circle"></i> Stop Scanning';
    bar.style.display='block';
    showToast('<i class="fas fa-barcode"></i> Scanner active — scan any barcode');
  }else{
    btn.style.background='';btn.textContent='';btn.innerHTML='<i class="fas fa-barcode"></i> Scan Mode';
    bar.style.display='none';
    _scanBuf='';
    showToast('Scanner stopped');
  }
}

document.addEventListener('keydown',function(e){
  if(!_scanActive)return;
  const now=Date.now();
  if(e.key==='Enter'){
    if(_scanBuf.length>2)processScan(_scanBuf.trim());
    _scanBuf='';return;
  }
  // Reset if human-speed typing (>150ms gap means manual keyboard, not scanner)
  if(now-_lastKeyTime>150&&_scanBuf.length>0)_scanBuf='';
  if(e.key.length===1){_scanBuf+=e.key;e.preventDefault();}
  _lastKeyTime=now;
  clearTimeout(_scanTimer);
  _scanTimer=setTimeout(()=>_scanBuf='',800);
});

function processScan(code){
  const map=buildBarcodeMap();
  const found=map[code];
  _scanRQty=1;_scanIQty=0;
  showScanModal(code,found?found.it:null,found?found.cat:null);
}

}

function applyScan(itemId,cat){
  const it=INV[cat].find(i=>i.id===itemId);
  if(!it){closeScanModal();return;}
  const wk=Math.min(4,Math.ceil(new Date().getDate()/7));
  it['w'+wk+'r']=(it['w'+wk+'r']||0)+_scanRQty;
  it['w'+wk+'i']=(it['w'+wk+'i']||0)+_scanIQty;
  it.onHand=Math.max(0,it.onHand+_scanRQty-_scanIQty);
  persistInv();
  showToast(`✓ ${it.desc.substring(0,30)} — +${_scanRQty} rcvd, −${_scanIQty} issued`);
  closeScanModal();
  if(_curPg==='inventory')setTimeout(renderInv,100);
  _scanRQty=1;_scanIQty=0;
}

function genSyncQR(){
  const wrap=document.getElementById('sync-qr-wrap');
  const out=document.getElementById('sync-qr-out');
  const msg=document.getElementById('sync-qr-msg');
  out.innerHTML='';msg.textContent='';
  // Build compact payload: just on-hand, weekly data keyed by item id
  const compact={ts:Date.now(),m:+document.getElementById('selMonth').value,y:+document.getElementById('selYear').value,d:{}};
  Object.entries(INV).forEach(([cat,items])=>{
    items.forEach(it=>{
      const hasData=it.onHand||it.w1r||it.w2r||it.w3r||it.w4r||it.w1i||it.w2i||it.w3i||it.w4i;
      if(hasData)compact.d[it.id]=[it.onHand,it.w1r,it.w2r,it.w3r,it.w4r,it.w1i,it.w2i,it.w3i,it.w4i];
    });
  });
  let payload='';
  try{
    payload=typeof LZString!=='undefined'?LZString.compressToEncodedURIComponent(JSON.stringify(compact)):btoa(JSON.stringify(compact));
  }catch(e){payload=btoa(JSON.stringify(compact)).substring(0,2000);}
  const qrText='MJCINV:'+payload;
  if(qrText.length>2953){
    msg.textContent='<i class="fas fa-exclamation-triangle"></i> Data too large for QR ('+qrText.length+' chars). Use Method 4 (File Share) for full sync.';
    wrap.style.display='none';return;
  }
  wrap.style.display='block';
  try{
    new QRCode(out,{text:qrText,width:220,height:220,correctLevel:QRCode.CorrectLevel.M});
  }catch(e){msg.textContent='QR generation failed — use file export instead.';}
}

async function shareExport(){
  const data=buildExportObj();
  const json=JSON.stringify(data,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const file=new File([blob],'mjc_inventory_'+new Date().toISOString().slice(0,10)+'.json',{type:'application/json'});
  if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:'MJC Inventory Data',text:'Miami Job Corps Cafeteria Inventory'});}
    catch(e){if(e.name!=='AbortError')exportData();}
  }else{exportData();}
}

function buildExportObj(){
  const out={version:2,exportedAt:new Date().toISOString(),liveMonth:{month:4,year:2026},liveInventory:INV,snapshots:{}};
  return out;
}

/* ── EXPORT / IMPORT ── */
function exportData(){
  const out=buildExportObj();
  const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='mjc_inventory_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();URL.revokeObjectURL(url);
  showToast('⬇ Exported — transfer this file to sync any device');
}

function importData(event){
  const file=event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      let msg='';
      // Restore live inventory
      if(data.liveInventory){
        INV=data.liveInventory;
        persistInv();
        msg+='Live inventory restored. ';
      }
      // Snapshots are loaded from server — skip localStorage
      let count=0;
      if(data.snapshots){
        count=Object.keys(data.snapshots).length;
        msg+=count+' month snapshots included in export.';
      }
      showToast('⬆ '+msg);
      renderActive();
      if(_curPg==='history')renderHistory();
    }catch(err){
      showToast('<i class="fas fa-exclamation-triangle"></i> Could not read file — make sure it is a valid export');
    }
    event.target.value='';
  };
  reader.readAsText(file);
}

// ── MONTH ROLLOVER ────────────────────────────────────────────────────────────
// Closes the current month and rolls each item's ending inventory forward
// as the starting on-hand for the next month. Clears all weekly received/issued.
function rollToNextMonth(){
  const m = +document.getElementById('selMonth').value;
  const y = +document.getElementById('selYear').value;
  let nm = m+1, ny = y;
  if(nm > 11){ nm = 0; ny++; }
  const curName  = MONTHS[m]+' '+y;
  const nextName = MONTHS[nm]+' '+ny;

  // Summary for confirmation dialog
  const endTotal  = grandTotal();
  const totalRcvd = wk1Total()+wk2Total()+wk3Total()+wk4Total();
  const totalIssd = allItems().reduce((s,i)=>s+(i.w1i+i.w2i+i.w3i+i.w4i)*i.price,0);

  if(!confirm(
    `Close ${curName} and roll forward to ${nextName}?\n\n` +
    `${curName} summary:\n` +
    `  Ending inventory: $${$f(endTotal)}\n` +
    `  Total received:   $${$f(totalRcvd)}\n` +
    `  Total issued:     $${$f(totalIssd)}\n\n` +
    `This will:\n` +
    `  <i class="fas fa-check"></i> Save ${curName} snapshot to history\n` +
    `  <i class="fas fa-check"></i> Set ${nextName} starting on-hand from ${curName} ending values\n` +
    `  <i class="fas fa-check"></i> Clear all weekly received & issued fields\n` +
    `  <i class="fas fa-check"></i> Advance month selector to ${nextName}`
  )) return;

  // 1. Save snapshot for the closing month
  saveSnapshot();

  // 2. Roll each item forward: ending value → new starting on-hand
  allItems().forEach(it=>{
    const ending = Math.max(0,
      it.onHand
      +(it.w1r+it.w2r+it.w3r+it.w4r)
      -(it.w1i+it.w2i+it.w3i+it.w4i)
    );
    it.onHand = ending;
    // Clear all weekly fields — fresh start for new month
    it.w1r=it.w2r=it.w3r=it.w4r=0;
    it.w1i=it.w2i=it.w3i=it.w4i=0;
  });

  // 3. Advance month selector
  document.getElementById('selMonth').value = nm;
  document.getElementById('selYear').value  = ny;

  // 4. Persist rolled inventory and re-render
  persistInv();
  renderActive();
  if(_curPg==='history') renderHistory();

  showToast(`✅ Rolled to ${nextName} — starting on-hand: $${$f(endTotal)}`);
}

// Auto-detect if rollover is overdue (current real date is past the tracked month)
function checkRolloverNeeded(){
  const selM = +document.getElementById('selMonth').value;
  const selY = +document.getElementById('selYear').value;
  const now  = new Date();
  const curM = now.getMonth();
  const curY = now.getFullYear();
  // If the tracked month is behind the real month by 1+
  if(selY < curY || (selY===curY && selM < curM)){
    const tracked = MONTHS[selM]+' '+selY;
    const real    = MONTHS[curM]+' '+curY;
    showToast(`📅 You're tracking ${tracked} but it's now ${real}. Use "Close Month →" to roll forward.`);
  }
}

function getHistory(){
  // History comes from server-loaded API data; HIST_DATA is the local cache
  return [...HIST_DATA].sort((a,b)=>a.year!==b.year?b.year-a.year:b.month-a.month);
}

function deleteSnap(y,m){
  // Snapshots are managed server-side — reload from server
  showToast('Snapshots are managed on the server');
  // Re-fetch history from API and re-render
  fetch('/api/inventory/history', { credentials: 'include' })
    .then(r => r.json())
    .then(data => {
      if (Array.isArray(data) && data.length > 0) {
        HIST_DATA.length = 0;
        data.forEach(h => HIST_DATA.push(apiSnapshotToHist(h)));
      }
      renderHistory();
    })
    .catch(() => renderHistory());
}

function psLiveEdit(id, field, val){
  const v = Math.max(0, parseInt(val)||0);
  let item=null;
  Object.keys(INV).forEach(c=>INV[c].forEach(it=>{if(it.id===id){it[field]=v;item=it;}}));
  if(!item) return;
  const oh = calcOH(item);
  const ohCell = document.getElementById('ps-oh-'+id);
  if(ohCell){
    const isReorder = oh < item.par && item.par > 0;
    const isCritical = oh <= 0;
    ohCell.textContent = oh;
    ohCell.style.color = isCritical?'#DC2626':isReorder?'#D97706':'#059669';
  }
  const nmCell = document.getElementById('ps-nm-'+id);
  if(nmCell) nmCell.textContent = '$'+(oh*item.price).toFixed(2);
  const showCats = _psCategory==='All'?Object.keys(INV):[_psCategory];
  const ai = showCats.flatMap(c=>INV[c]);
  const _r = ai.reduce((s,i)=>s+(i.w1r+i.w2r+i.w3r+i.w4r)*i.price,0);
  const _is = ai.reduce((s,i)=>s+(i.w1i+i.w2i+i.w3i+i.w4i)*i.price,0);
  const _st = ai.reduce((s,i)=>s+i.onHand*i.price,0);
  const _bal = _st+_r-_is;
  const _rc = ai.filter(i=>calcOH(i)<i.par&&i.par>0).length;
  ['ps-sum-rcvd','ps-ft-rcvd'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=$f(_r);});
  ['ps-sum-issued','ps-ft-issued'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=$f(_is);});
  ['ps-sum-balance','ps-ft-balance'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=$f(_bal);});
  const rc=document.getElementById('ps-sum-reorder');
  if(rc){rc.textContent=_rc;rc.style.color=_rc>0?'#F97316':'#6EE7B7';}
}

async function doParseAI(){
  const txt=(document.getElementById('inv-txt')||{value:''}).value.trim();
  const imgInput=document.getElementById('inv-img');
  const imgFile=imgInput?.files?.[0];
  if(!txt&&!imgFile){document.getElementById('ai-err').textContent='Paste invoice text or upload an image.';return;}
  document.getElementById('ai-err').textContent='';
  const btn=document.getElementById('ai-btn');btn.textContent='⏳ Analyzing…';btn.disabled=true;
  const m=+document.getElementById('selMonth').value;
  const y=+document.getElementById('selYear').value;
  try{
    let body;
    if(imgFile){
      const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(imgFile);});
      body=JSON.stringify({image:b64,month:m,year:y});
    }else{
      body=JSON.stringify({text:txt,month:m,year:y});
    }
    const res=await fetch('/api/inventory/parse-invoice',{method:'POST',
      credentials:'include',
      headers:{'Content-Type':'application/json'},
      body});
    if(!res.ok){const e=await res.json();throw new Error(e.error||'Parse failed');}
    const data=await res.json();
    _parsedCache=data.matches||[];
    renderParsed();
  }catch(e){document.getElementById('ai-err').textContent=e.message||'Could not parse invoice. Check format and try again.';}
  btn.textContent='✨ Parse with AI';btn.disabled=false;
}
function renderParsed(){
  const matched=_parsedCache.filter(p=>p.itemId!=='NEW'),newI=_parsedCache.filter(p=>p.itemId==='NEW');
  let h=`<div style="font-weight:700;margin-bottom:8px;font-size:12px">Matched ${matched.length} items · ${newI.length} unmatched</div>
  <div class="section"><table><thead><tr>
    <th class="tl" style="padding:6px 10px">Matched item</th><th style="width:70px">Qty</th><th style="width:90px">Unit $</th><th style="width:80px">Status</th>
  </tr></thead><tbody>`;
  _parsedCache.forEach(p=>{h+=`<tr>
    <td class="tl" style="padding:6px 10px;font-size:11px">${(p.matchedDesc||p.itemId).replace(/</g,'&lt;')}</td>
    <td class="num" style="font-weight:700">${p.qty}</td>

  </tr>`;});
  h+=`</tbody></table></div>
  <div style="display:flex;gap:8px;margin-top:10px">
    <button class="btn-g icon-btn" onclick="applyParsed()"><i class="fas fa-check"></i> Apply to inventory</button>
    <button class="btn-s" onclick="document.getElementById('parsed-out').innerHTML=''">Discard</button>
  </div>`;

}
function showToast(msg='<i class="fas fa-check"></i> Applied to inventory'){

async function applyParsed(){
  const wk=document.getElementById('inv-wk').value;
  const m=+document.getElementById('selMonth').value;
  const y=+document.getElementById('selYear').value;
  try{
    const res=await fetch('/api/inventory/apply-invoice',{method:'POST',
      credentials:'include',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({matches:_parsedCache,week_field:wk,month:m,year:y})});
    if(!res.ok){const e=await res.json();throw new Error(e.error||'Apply failed');}
    document.getElementById('parsed-out').innerHTML='';
    document.getElementById('inv-txt').value='';_parsedCache=[];
    await initDashboard();
    showToast();
  }catch(e){document.getElementById('ai-err').textContent=e.message||'Could not apply.';}
}

// ── API HELPERS ─────────────────────────────────────────────────────────
function apiItemToInvItem(apiItem) {
  return {
    id:      apiItem.state_id,
    item_id: apiItem.item_id,
    sku:     apiItem.sku || '',
    desc:    apiItem.description,
    price:   parseFloat(apiItem.unit_price) || 0,
    onHand:  parseFloat(apiItem.on_hand) || 0,
    par:     parseInt(apiItem.par_level) || 0,
    w1i:     parseFloat(apiItem.w1_issued) || 0,
    w2i:     parseFloat(apiItem.w2_issued) || 0,
    w3i:     parseFloat(apiItem.w3_issued) || 0,
    w4i:     parseFloat(apiItem.w4_issued) || 0,
    w1r:     parseFloat(apiItem.w1_received) || 0,
    w2r:     parseFloat(apiItem.w2_received) || 0,
    w3r:     parseFloat(apiItem.w3_received) || 0,
    w4r:     parseFloat(apiItem.w4_received) || 0,
  };
}
function apiItemsToINV(apiItems) {
  const inv = {};
  const categoryOrder = [
    'Dairy','Cereal','Beverages','Snacks','Dry Goods',
    'Produce & Fresh','Protein & Meat','Frozen Foods','Supplies'
  ];
  categoryOrder.forEach(cat => inv[cat] = []);
  apiItems.forEach(item => {
    const cat = item.category;
    if (!inv[cat]) inv[cat] = [];
    inv[cat].push(apiItemToInvItem(item));
  });
  return inv;
}
function apiSnapshotToHist(snap) {
  var cats = snap.category_totals || snap.category_breakdown || {};
  var categories = {};
  Object.keys(cats).forEach(function(k) {
    var v = cats[k];
    if (typeof v === 'number' || typeof v === 'string') {
      categories[k] = { total: parseFloat(v) || 0, issued: 0, received: 0, count: 0 };
    } else {
      categories[k] = v;
    }
  });
  return {
    month:      snap.month,
    year:       snap.year,
    grandTotal: parseFloat(snap.grand_total) || 0,
    wk1Total:   parseFloat(snap.wk1_total) || 0,
    wk2Total:   parseFloat(snap.wk2_total) || 0,
    wk3Total:   parseFloat(snap.wk3_total) || 0,
    wk4Total:   parseFloat(snap.wk4_total) || 0,
    items:      snap.item_count || 0,
    reorders:   snap.reorder_count || 0,
    savedAt:    snap.saved_at,
    preset:     true,
    categories: categories,
  };
}

async function initDashboard() {
  document.getElementById('pg-dashboard').innerHTML =
    '<div style="padding:40px;text-align:center;color:#64748B;font-size:13px">' +
    '⏳ Loading inventory from server…</div>';
  try {
    const m = +document.getElementById('selMonth').value;
    const y = +document.getElementById('selYear').value;
    const [itemsRes, histRes] = await Promise.all([
      fetch('/api/inventory/items?month='+m+'&year='+y, { credentials: 'include' }),
      fetch('/api/inventory/history', { credentials: 'include' })
    ]);
    if (itemsRes.status === 401 || histRes.status === 401) {
      window.location.href = '/';
      return;
    }
    const apiItems = await itemsRes.json();
    const apiHistory = await histRes.json();
    const itemsArray = Array.isArray(apiItems)
      ? apiItems
      : apiItems && Array.isArray(apiItems.items)
      ? apiItems.items
      : null;
    if (itemsArray && itemsArray.length > 0) {
      INV = apiItemsToINV(itemsArray);
      persistInv();
      document.getElementById('sync-status').textContent = '✓ Loaded inventory from Supabase';
    }
    if (Array.isArray(apiHistory) && apiHistory.length > 0) {
      const apiHist = apiHistory.map(apiSnapshotToHist);
      HIST_DATA.length = 0;
      apiHist.forEach(h => HIST_DATA.push(h));
    }
  } catch(err) {
    console.warn('API load failed, using cached data:', err);
  }
  renderDash();
  renderInvoiceTab();
  setTimeout(checkRolloverNeeded, 1500);
}



initDashboard();
