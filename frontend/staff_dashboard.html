<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staff Portal — Adaptive Screening</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #0f1e35;
        color: #fff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* ── Nav ── */
      nav {
        background: #1a2b4a;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        padding: 0.875rem 1.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 100;
      }
      .nav-brand { display: flex; align-items: center; gap: 0.75rem; }
      .nav-icon {
        width: 36px; height: 36px;
        background: #243d61;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        font-size: 18px;
      }
      .nav-title { font-size: 0.95rem; font-weight: 600; }
      .nav-sub { font-size: 0.72rem; color: rgba(255,255,255,0.4); }
      .nav-right { display: flex; align-items: center; gap: 0.875rem; }
      .staff-chip {
        background: #1e3a5f;
        border: 1px solid rgba(138,180,248,0.25);
        color: #8ab4f8;
        padding: 0.25rem 0.75rem;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 600;
      }
      .btn-logout {
        background: transparent;
        border: 1px solid rgba(255,255,255,0.18);
        color: rgba(255,255,255,0.6);
        padding: 0.375rem 0.875rem;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.82rem;
        transition: 0.15s;
      }
      .btn-logout:hover { background: rgba(255,255,255,0.07); color: #fff; }

      /* ── Tabs ── */
      .tabs {
        background: #1a2b4a;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        display: flex;
        padding: 0 1.5rem;
        gap: 0.25rem;
      }
      .tab {
        padding: 0.75rem 1.25rem;
        cursor: pointer;
        font-size: 0.875rem;
        color: rgba(255,255,255,0.45);
        border-bottom: 2px solid transparent;
        transition: 0.15s;
        user-select: none;
      }
      .tab:hover { color: rgba(255,255,255,0.75); }
      .tab.active { color: #8ab4f8; border-bottom-color: #8ab4f8; font-weight: 500; }

      /* ── Layout ── */
      main { flex: 1; padding: 1.25rem; max-width: 780px; margin: 0 auto; width: 100%; }
      .panel { display: none; }
      .panel.active { display: block; }

      /* ── Card ── */
      .card {
        background: #1a2b4a;
        border: 1px solid rgba(255,255,255,0.07);
        border-radius: 12px;
        padding: 1.25rem 1.375rem;
        margin-bottom: 1rem;
      }
      .card-label {
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        color: rgba(255,255,255,0.35);
        margin-bottom: 1.125rem;
      }

      /* ── Scanner form ── */
      .field { margin-bottom: 1rem; }
      .field label { display: block; font-size: 0.78rem; color: rgba(255,255,255,0.5); margin-bottom: 0.375rem; }

      .barcode-input {
        width: 100%;
        background: #0f1e35;
        border: 1.5px solid rgba(255,255,255,0.12);
        border-radius: 8px;
        color: #fff;
        font-size: 1.05rem;
        padding: 0.8rem 1rem;
        outline: none;
        transition: border-color 0.15s;
        font-family: 'Courier New', monospace;
        letter-spacing: 0.04em;
      }
      .barcode-input:focus { border-color: #8ab4f8; }
      .barcode-input::placeholder { font-family: 'Segoe UI', Arial, sans-serif; font-size: 0.875rem; letter-spacing: normal; color: rgba(255,255,255,0.2); }

      .row { display: flex; gap: 0.75rem; align-items: flex-end; }
      .row .field { margin-bottom: 0; }
      .row .field:first-child { flex: 1; }

      .action-toggle {
        display: flex;
        border: 1.5px solid rgba(255,255,255,0.12);
        border-radius: 8px;
        overflow: hidden;
      }
      .action-toggle button {
        flex: 1;
        padding: 0.725rem 0.5rem;
        background: transparent;
        border: none;
        color: rgba(255,255,255,0.4);
        cursor: pointer;
        font-size: 0.875rem;
        font-weight: 600;
        transition: 0.15s;
        white-space: nowrap;
      }
      .action-toggle .sep { width: 1px; background: rgba(255,255,255,0.12); flex-shrink: 0; }
      .btn-action-in.on  { background: rgba(20,83,45,0.6);  color: #4ade80; }
      .btn-action-out.on { background: rgba(127,29,29,0.6); color: #f87171; }

      .qty-input {
        width: 90px;
        background: #0f1e35;
        border: 1.5px solid rgba(255,255,255,0.12);
        border-radius: 8px;
        color: #fff;
        font-size: 1rem;
        padding: 0.725rem 0.5rem;
        outline: none;
        text-align: center;
        transition: border-color 0.15s;
      }
      .qty-input:focus { border-color: #8ab4f8; }

      .btn-submit {
        width: 100%;
        margin-top: 0.875rem;
        padding: 0.8rem;
        background: #1d4ed8;
        border: none;
        border-radius: 8px;
        color: #fff;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
        letter-spacing: 0.02em;
      }
      .btn-submit:hover:not(:disabled) { background: #2563eb; }
      .btn-submit:disabled { background: #1e3a5f; color: rgba(255,255,255,0.35); cursor: not-allowed; }

      /* ── Feedback ── */
      .feedback {
        margin-top: 0.875rem;
        border-radius: 9px;
        padding: 0.875rem 1rem;
        display: none;
        align-items: center;
        gap: 0.75rem;
        border: 1px solid;
      }
      .feedback.show { display: flex; }
      .feedback.ok  { background: rgba(20,83,45,0.3);   border-color: rgba(74,222,128,0.3); }
      .feedback.err { background: rgba(127,29,29,0.3);  border-color: rgba(248,113,113,0.3); }
      .fb-icon { font-size: 1.25rem; flex-shrink: 0; }
      .fb-main { font-weight: 600; margin-bottom: 0.1rem; }
      .fb-sub  { font-size: 0.82rem; color: rgba(255,255,255,0.55); }

      /* ── Recent scans ── */
      .scans-list { list-style: none; }
      .scan-row {
        display: flex;
        align-items: center;
        gap: 0.625rem;
        padding: 0.55rem 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        font-size: 0.85rem;
      }
      .scan-row:last-child { border-bottom: none; }
      .scan-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
      .dot-in  { background: #4ade80; }
      .dot-out { background: #f87171; }
      .scan-name { flex: 1; color: rgba(255,255,255,0.82); }
      .scan-after { font-size: 0.78rem; color: rgba(255,255,255,0.35); }
      .scan-change { font-weight: 700; }
      .change-in  { color: #4ade80; }
      .change-out { color: #f87171; }
      .scan-time { font-size: 0.75rem; color: rgba(255,255,255,0.3); }
      .no-scans { text-align: center; padding: 1.5rem; color: rgba(255,255,255,0.28); font-size: 0.875rem; }

      /* ── Inventory ── */
      .filter-bar { display: flex; gap: 0.625rem; margin-bottom: 0.875rem; flex-wrap: wrap; }
      .inv-search, .cat-select {
        background: #1a2b4a;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 7px;
        color: #fff;
        font-size: 0.85rem;
        padding: 0.475rem 0.75rem;
        outline: none;
        transition: border-color 0.15s;
      }
      .inv-search { flex: 1; min-width: 160px; }
      .inv-search:focus, .cat-select:focus { border-color: #8ab4f8; }
      .cat-select option { background: #1a2b4a; }

      .inv-count { font-size: 0.78rem; color: rgba(255,255,255,0.35); margin-bottom: 0.625rem; }

      table { width: 100%; border-collapse: collapse; font-size: 0.835rem; }
      th {
        text-align: left;
        padding: 0.425rem 0.625rem;
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: rgba(255,255,255,0.35);
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }
      td {
        padding: 0.55rem 0.625rem;
        border-bottom: 1px solid rgba(255,255,255,0.045);
        color: rgba(255,255,255,0.82);
        vertical-align: middle;
      }
      tr:last-child td { border-bottom: none; }
      tr:hover td { background: rgba(255,255,255,0.025); }
      .mono { font-family: 'Courier New', monospace; font-size: 0.78rem; }

      .badge {
        display: inline-block;
        padding: 0.175rem 0.5rem;
        border-radius: 20px;
        font-size: 0.7rem;
        font-weight: 700;
      }
      .badge-ok       { background: rgba(20,83,45,0.45);   color: #4ade80; }
      .badge-low      { background: rgba(120,53,15,0.45);  color: #fbbf24; }
      .badge-critical { background: rgba(127,29,29,0.45);  color: #f87171; }
      .badge-nopar    { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.3); }

      .placeholder { text-align: center; padding: 2.5rem; color: rgba(255,255,255,0.3); font-size: 0.875rem; }
    </style>
  </head>
  <body>

    <nav>
      <div class="nav-brand">
        <div class="nav-icon">📋</div>
        <div>
          <div class="nav-title">Adaptive Screening</div>
          <div class="nav-sub">Staff Portal</div>
        </div>
      </div>
      <div class="nav-right">
        <span class="staff-chip" id="staffName">Staff</span>
        <button class="btn-logout" id="logoutBtn">Logout</button>
      </div>
    </nav>

    <div class="tabs">
      <div class="tab active" data-tab="scanner">Scanner</div>
      <div class="tab" data-tab="inventory">Inventory</div>
    </div>

    <main>

      <!-- SCANNER PANEL -->
      <div class="panel active" id="panel-scanner">
        <div class="card">
          <div class="card-label">Scan an Item</div>

          <div class="field">
            <label for="barcodeInput">Barcode</label>
            <input id="barcodeInput" class="barcode-input" type="text"
              placeholder="Scan or type barcode, then press Enter"
              autocomplete="off" autocorrect="off" spellcheck="false" />
          </div>

          <div class="row">
            <div class="field">
              <label>Action</label>
              <div class="action-toggle">
                <button class="btn-action-in on" id="btnIn" onclick="setAction('in')">IN — Receiving</button>
                <div class="sep"></div>
                <button class="btn-action-out" id="btnOut" onclick="setAction('out')">OUT — Issuing</button>
              </div>
            </div>
            <div class="field">
              <label for="qtyInput">Qty</label>
              <input id="qtyInput" class="qty-input" type="number" value="1" min="1" step="1" />
            </div>
          </div>

          <button class="btn-submit" id="submitBtn">Scan Item</button>

          <div class="feedback" id="feedback">
            <div class="fb-icon" id="fbIcon"></div>
            <div>
              <div class="fb-main" id="fbMain"></div>
              <div class="fb-sub"  id="fbSub"></div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-label">Recent Scans — This Session</div>
          <ul class="scans-list" id="scansList">
            <li class="no-scans">No scans yet</li>
          </ul>
        </div>
      </div>

      <!-- INVENTORY PANEL -->
      <div class="panel" id="panel-inventory">
        <div class="filter-bar">
          <input class="inv-search" id="invSearch" type="text" placeholder="Search item or barcode…" oninput="filterInv()" />
          <select class="cat-select" id="catFilter" onchange="filterInv()">
            <option value="">All Categories</option>
          </select>
        </div>
        <div class="inv-count" id="invCount"></div>
        <div class="card" style="padding:0;overflow:hidden">
          <div id="invBody"><div class="placeholder">Loading inventory…</div></div>
        </div>
      </div>

    </main>

    <script>
      'use strict';

      let action = 'in';
      let recentScans = [];
      let allItems = [];

      /* ── Auth ── */
      (async () => {
        const res = await fetch('/api/auth/me');
        if (!res.ok) { location.href = '/'; return; }
        const d = await res.json();
        if (!d.authenticated || d.user.role !== 'staff') { location.href = '/'; return; }
        document.getElementById('staffName').textContent = d.user.display_name || d.user.username;
        document.getElementById('barcodeInput').focus();
      })();

      document.getElementById('logoutBtn').addEventListener('click', async () => {
        await fetch('/api/auth/logout', { method: 'POST' });
        location.href = '/';
      });

      /* ── Tabs ── */
      document.querySelectorAll('.tab').forEach(t => {
        t.addEventListener('click', () => {
          document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
          document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
          t.classList.add('active');
          document.getElementById('panel-' + t.dataset.tab).classList.add('active');
          if (t.dataset.tab === 'inventory' && !allItems.length) loadInventory();
          if (t.dataset.tab === 'scanner') document.getElementById('barcodeInput').focus();
        });
      });

      /* ── Scanner ── */
      function setAction(a) {
        action = a;
        document.getElementById('btnIn').className  = 'btn-action-in'  + (a === 'in'  ? ' on' : '');
        document.getElementById('btnOut').className = 'btn-action-out' + (a === 'out' ? ' on' : '');
      }

      document.getElementById('barcodeInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); doScan(); }
      });
      document.getElementById('submitBtn').addEventListener('click', doScan);

      async function doScan() {
        const barcode = document.getElementById('barcodeInput').value.trim();
        const qty = parseFloat(document.getElementById('qtyInput').value) || 1;
        if (!barcode) { document.getElementById('barcodeInput').focus(); return; }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = 'Scanning…';
        hideFeedback();

        try {
          const res = await fetch('/api/v1/scanner/scan', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ barcode, action, quantity: qty }),
          });
          const d = await res.json();

          if (res.ok) {
            const sign = action === 'in' ? '+' : '−';
            showFeedback('ok', '✓', sign + qty + ' × ' + d.item_name, 'Stock now: ' + d.quantity_after + ' units');
            addScan(d, qty);
            document.getElementById('barcodeInput').value = '';
            document.getElementById('qtyInput').value = '1';
          } else {
            showFeedback('err', '✕', 'Scan failed', d.error || 'Unknown error');
          }
        } catch {
          showFeedback('err', '✕', 'Connection error', 'Could not reach the server');
        } finally {
          btn.disabled = false;
          btn.textContent = 'Scan Item';
          document.getElementById('barcodeInput').focus();
        }
      }

      function showFeedback(cls, icon, main, sub) {
        const el = document.getElementById('feedback');
        el.className = 'feedback show ' + cls;
        document.getElementById('fbIcon').textContent = icon;
        document.getElementById('fbMain').textContent = main;
        document.getElementById('fbSub').textContent  = sub;
      }
      function hideFeedback() {
        document.getElementById('feedback').className = 'feedback';
      }

      function addScan(d, qty) {
        const t = new Date();
        const time = t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        recentScans.unshift({ name: d.item_name, action, qty, after: d.quantity_after, time });
        if (recentScans.length > 10) recentScans.pop();
        renderScans();
      }

      function renderScans() {
        const list = document.getElementById('scansList');
        if (!recentScans.length) {
          list.innerHTML = '<li class="no-scans">No scans yet</li>';
          return;
        }
        list.innerHTML = recentScans.map(s => {
          const sign = s.action === 'in' ? '+' : '−';
          return `<li class="scan-row">
            <div class="scan-dot ${s.action === 'in' ? 'dot-in' : 'dot-out'}"></div>
            <div class="scan-name">${esc(s.name)}</div>
            <div class="scan-after">→ ${s.after} in stock</div>
            <div class="scan-change ${s.action === 'in' ? 'change-in' : 'change-out'}">${sign}${s.qty}</div>
            <div class="scan-time">${s.time}</div>
          </li>`;
        }).join('');
      }

      /* ── Inventory ── */
      async function loadInventory() {
        document.getElementById('invBody').innerHTML = '<div class="placeholder">Loading…</div>';
        try {
          const res = await fetch('/api/v1/inventory?per_page=500');
          if (!res.ok) throw new Error();
          const d = await res.json();
          allItems = d.items || [];
          buildCatFilter();
          filterInv();
        } catch {
          document.getElementById('invBody').innerHTML = '<div class="placeholder">Failed to load inventory</div>';
        }
      }

      function buildCatFilter() {
        const cats = [...new Set(allItems.map(i => i.category).filter(Boolean))].sort();
        const sel = document.getElementById('catFilter');
        sel.innerHTML = '<option value="">All Categories</option>' +
          cats.map(c => `<option>${esc(c)}</option>`).join('');
      }

      function filterInv() {
        const q   = document.getElementById('invSearch').value.toLowerCase();
        const cat = document.getElementById('catFilter').value;
        const rows = allItems.filter(i =>
          (!cat || i.category === cat) &&
          (!q   || (i.item_name||'').toLowerCase().includes(q) || (i.barcode||'').toLowerCase().includes(q))
        );
        document.getElementById('invCount').textContent = rows.length + ' item' + (rows.length !== 1 ? 's' : '');
        renderInv(rows);
      }

      function renderInv(rows) {
        if (!rows.length) {
          document.getElementById('invBody').innerHTML = '<div class="placeholder">No items found</div>';
          return;
        }
        document.getElementById('invBody').innerHTML = `
          <table>
            <thead>
              <tr>
                <th>Item</th>
                <th>Category</th>
                <th>Barcode</th>
                <th>Qty</th>
                <th>Par</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(i => {
                const qty = parseFloat(i.quantity || 0);
                const par = parseFloat(i.par_level || 0);
                return `<tr>
                  <td>${esc(i.item_name || '—')}</td>
                  <td style="color:rgba(255,255,255,0.5)">${esc(i.category || '—')}</td>
                  <td class="mono">${esc(i.barcode || '—')}</td>
                  <td><strong>${qty}</strong></td>
                  <td style="color:rgba(255,255,255,0.45)">${par || '—'}</td>
                  <td>${statusBadge(qty, par)}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>`;
      }

      function statusBadge(qty, par) {
        if (!par) return '<span class="badge badge-nopar">No par</span>';
        if (qty >= par)       return '<span class="badge badge-ok">OK</span>';
        if (qty >= par * 0.5) return '<span class="badge badge-low">Low</span>';
        return '<span class="badge badge-critical">Critical</span>';
      }

      function esc(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }
    </script>
  </body>
</html>
