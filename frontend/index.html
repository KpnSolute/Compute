<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Miami Job Corps Cafeteria — Sign In</title>
    <link rel="icon" type="image/svg+xml" href="/logo-shield.svg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #0f1e35;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .wrap {
        width: 100%;
        max-width: 400px;
      }
      .brand {
        text-align: center;
        margin-bottom: 32px;
      }
      .brand-icon {
        width: 80px;
        height: 80px;
        border-radius: 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        margin-bottom: 14px;
      }
      .brand-icon img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .brand-name {
        color: #fff;
        font-size: 18px;
        font-weight: 700;
        line-height: 1.3;
      }
      .brand-sub {
        color: rgba(255, 255, 255, 0.45);
        font-size: 12px;
        margin-top: 4px;
      }
      .card {
        background: #1a2b4a;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 28px 28px 24px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      }
      .card-title {
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 20px;
      }
      .field {
        margin-bottom: 14px;
      }
      label {
        display: block;
        color: rgba(255, 255, 255, 0.6);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        margin-bottom: 6px;
      }
      input[type='text'],
      input[type='password'] {
        width: 100%;
        padding: 10px 13px;
        background: rgba(255, 255, 255, 0.07);
        border: 1.5px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        color: #fff;
        font-size: 13px;
        font-family: inherit;
        outline: none;
      }
      .type-row {
        display: flex;
        gap: 8px;
        margin-bottom: 18px;
      }
      .type-btn {
        flex: 1;
        padding: 8px;
        border-radius: 7px;
        border: 1.5px solid rgba(255, 255, 255, 0.12);
        background: transparent;
        color: rgba(255, 255, 255, 0.5);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        text-align: center;
      }
      .type-btn.active {
        background: #2d4a7a;
        border-color: rgba(255, 255, 255, 0.3);
        color: #fff;
      }
      .btn-login {
        width: 100%;
        padding: 12px;
        background: #059669;
        border: none;
        border-radius: 9px;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        font-family: inherit;
        margin-top: 4px;
      }
      .error-msg {
        background: rgba(220, 38, 38, 0.15);
        border: 1px solid rgba(220, 38, 38, 0.35);
        border-radius: 7px;
        color: #fca5a5;
        font-size: 12px;
        padding: 9px 12px;
        margin-bottom: 14px;
        display: none;
      }
      .expired-msg {
        background: rgba(250, 204, 21, 0.15);
        border: 1px solid rgba(250, 204, 21, 0.4);
        border-radius: 7px;
        color: #fde68a;
        font-size: 12px;
        padding: 9px 12px;
        margin-bottom: 14px;
        display: none;
      }
      .expired-msg i {
        margin-right: 6px;
      }
      .footer {
        text-align: center;
        color: rgba(255, 255, 255, 0.2);
        font-size: 10px;
        margin-top: 22px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">
        <div class="brand-icon"><img src="/logo-shield.svg" alt="MJC Shield" /></div>
        <div class="brand-name">Miami Job Corps Cafeteria</div>
        <div class="brand-sub">Inventory Management Portal</div>
      </div>
      <div class="card">
        <div id="expired-banner" class="expired-msg" style="display: none">
          <i class="fas fa-clock"></i> Your session expired, please sign in again
        </div>
        <div class="card-title">Sign In</div>
        <div class="type-row">
          <button class="type-btn active" onclick="setType('staff')" id="btn-staff">
            <i class="fas fa-user"></i> Staff
          </button>
          <button class="type-btn" onclick="setType('admin')" id="btn-admin">
            <i class="fas fa-key"></i> Admin / Manager
          </button>
        </div>
        <div id="error-msg" class="error-msg"></div>
        <div class="field">
          <label>Username</label
          ><input
            type="text"
            id="inp-username"
            placeholder="Enter username"
            autocomplete="username"
          />
        </div>
        <div id="field-pin" class="field">
          <label>PIN</label
          ><input
            type="password"
            id="inp-pin"
            placeholder="Enter 4-digit PIN"
            maxlength="4"
            inputmode="numeric"
            autocomplete="current-password"
          />
        </div>
        <div id="field-password" class="field" style="display: none">
          <label>Password</label
          ><input
            type="password"
            id="inp-password"
            placeholder="Enter password"
            autocomplete="current-password"
          />
        </div>
        <button class="btn-login" onclick="doLogin()">Sign In →</button>
      </div>
      <div class="footer">Miami Job Corps Cafeteria · Food Service Division · May 2026</div>
    </div>
    <script>
      let loginType = 'staff';
      function setType(t) {
        loginType = t;
        document.getElementById('btn-staff').classList.toggle('active', t === 'staff');
        document.getElementById('btn-admin').classList.toggle('active', t === 'admin');
        document.getElementById('field-pin').style.display = t === 'staff' ? 'block' : 'none';
        document.getElementById('field-password').style.display = t === 'staff' ? 'none' : 'block';
        clearError();
      }
      function clearError() {
        const el = document.getElementById('error-msg');
        el.style.display = 'none';
        el.textContent = '';
      }
      function showError(msg) {
        const el = document.getElementById('error-msg');
        el.textContent = msg;
        el.style.display = 'block';
      }
      async function doLogin() {
        clearError();
        const username = document.getElementById('inp-username').value.trim();
        if (!username) {
          showError('Please enter your username.');
          return;
        }
        const payload = { username, type: loginType };
        if (loginType === 'staff') {
          const pin = document.getElementById('inp-pin').value.trim();
          if (!pin) {
            showError('Please enter your PIN.');
            return;
          }
          payload.pin = pin;
        } else {
          const password = document.getElementById('inp-password').value;
          if (!password) {
            showError('Please enter your password.');
            return;
          }
          payload.password = password;
        }
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          if (!res.ok) {
            showError(data.error || 'Login failed.');
            return;
          }
          // Redirect based on role
          window.location.href = '/app';
        } catch (e) {
          showError('Could not connect to server. Please try again.');
        }
      }
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') doLogin();
      });
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('expired') === '1') {
        document.getElementById('expired-banner').style.display = 'block';
      }
      setType('staff');
    </script>
  </body>
</html>
