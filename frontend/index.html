<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miami Job Corps Cafeteria — Sign In</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0F1E35;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.wrap{width:100%;max-width:400px}
.brand{text-align:center;margin-bottom:32px}
.brand-icon{width:64px;height:64px;background:#1A2B4A;border:2px solid rgba(255,255,255,.12);border-radius:16px;display:inline-flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:14px}
.brand-name{color:#fff;font-size:18px;font-weight:700;line-height:1.3}
.brand-sub{color:rgba(255,255,255,.45);font-size:12px;margin-top:4px}
.card{background:#1A2B4A;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:28px 28px 24px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.card-title{color:#fff;font-size:15px;font-weight:700;margin-bottom:20px}
.field{margin-bottom:14px}
label{display:block;color:rgba(255,255,255,.6);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
input[type=text],input[type=password]{width:100%;padding:10px 13px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);border-radius:8px;color:#fff;font-size:13px;font-family:inherit;outline:none}
.type-row{display:flex;gap:8px;margin-bottom:18px}
.type-btn{flex:1;padding:8px;border-radius:7px;border:1.5px solid rgba(255,255,255,.12);background:transparent;color:rgba(255,255,255,.5);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;text-align:center}
.type-btn.active{background:#2D4A7A;border-color:rgba(255,255,255,.3);color:#fff}
.btn-login{width:100%;padding:12px;background:#059669;border:none;border-radius:9px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:4px}
.error-msg{background:rgba(220,38,38,.15);border:1px solid rgba(220,38,38,.35);border-radius:7px;color:#FCA5A5;font-size:12px;padding:9px 12px;margin-bottom:14px;display:none}
.footer{text-align:center;color:rgba(255,255,255,.2);font-size:10px;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-icon">🏭</div>
    <div class="brand-name">Miami Job Corps Cafeteria</div>
    <div class="brand-sub">Inventory Management Portal</div>
  </div>
  <div class="card">
    <div class="card-title">Sign In</div>
    <div class="type-row">
      <button class="type-btn active" onclick="setType('staff')" id="btn-staff">👤 Staff</button>
      <button class="type-btn" onclick="setType('admin')" id="btn-admin">🔑 Admin / Manager</button>
    </div>
    <div id="error-msg" class="error-msg"></div>
    <div class="field"><label>Username</label><input type="text" id="inp-username" placeholder="Enter username" autocomplete="username"></div>
    <div id="field-pin" class="field"><label>PIN</label><input type="password" id="inp-pin" placeholder="Enter 4-digit PIN" maxlength="4" inputmode="numeric" autocomplete="current-password"></div>
    <div id="field-password" class="field" style="display:none"><label>Password</label><input type="password" id="inp-password" placeholder="Enter password" autocomplete="current-password"></div>
    <button class="btn-login" onclick="doLogin()">Sign In →</button>
  </div>
  <div class="footer">Miami Job Corps Cafeteria · Food Service Division · May 2026</div>
</div>
<script>
let loginType='staff';
function setType(t){loginType=t;document.getElementById('btn-staff').classList.toggle('active',t==='staff');document.getElementById('btn-admin').classList.toggle('active',t==='admin');document.getElementById('field-pin').style.display=t==='staff'?'block':'none';document.getElementById('field-password').style.display=t==='staff'?'none':'block';clearError();}
function clearError(){const el=document.getElementById('error-msg');el.style.display='none';el.textContent='';}
function showError(msg){const el=document.getElementById('error-msg');el.textContent=msg;el.style.display='block';}
async function doLogin(){
  clearError();
  const username = document.getElementById('inp-username').value.trim();
  if(!username){ showError('Please enter your username.'); return; }
  const payload = { username, type: loginType };
  if(loginType === 'staff'){
    const pin = document.getElementById('inp-pin').value.trim();
    if(!pin){ showError('Please enter your PIN.'); return; }
    payload.pin = pin;
  } else {
    const password = document.getElementById('inp-password').value;
    if(!password){ showError('Please enter your password.'); return; }
    payload.password = password;
  }
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if(!res.ok){ showError(data.error || 'Login failed.'); return; }
    // Redirect based on role
    if(data.user.role === 'staff'){
      window.location.href = '/dashboard';
    } else {
      window.location.href = '/dashboard';
    }
  } catch(e) {
    showError('Could not connect to server. Please try again.');
  }
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
setType('staff');
</script>
</body>
</html>
