<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MJCC · Sign In</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        background: #fff;
        border-radius: 16px;
        padding: 40px 36px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 28px;
      }
      .logo-icon {
        width: 44px;
        height: 44px;
        background: #1e40af;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 20px;
      }
      .logo-text h1 {
        font-size: 18px;
        font-weight: 700;
        color: #0f172a;
      }
      .logo-text p {
        font-size: 12px;
        color: #64748b;
        margin-top: 1px;
      }
      .expired-banner {
        display: none;
        background: #fef3c7;
        border: 1px solid #f59e0b;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 13px;
        color: #92400e;
        margin-bottom: 16px;
      }
      .type-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
        background: #f1f5f9;
        border-radius: 10px;
        padding: 4px;
      }
      .type-btn {
        flex: 1;
        padding: 8px 12px;
        border: none;
        cursor: pointer;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        background: transparent;
        color: #64748b;
        transition: all 0.15s;
      }
      .type-btn.active {
        background: #fff;
        color: #1e40af;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
      }
      .field {
        margin-bottom: 16px;
      }
      .field label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: #475569;
        margin-bottom: 6px;
        letter-spacing: 0.03em;
      }
      .field input {
        width: 100%;
        padding: 10px 14px;
        border: 1.5px solid #e2e8f0;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
        transition: border-color 0.15s;
      }
      .field input:focus {
        border-color: #3b82f6;
      }
      .error-msg {
        display: none;
        background: #fef2f2;
        border: 1px solid #fca5a5;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 13px;
        color: #b91c1c;
        margin-bottom: 16px;
      }
      .btn-login {
        width: 100%;
        padding: 12px;
        background: #1e40af;
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
        margin-top: 4px;
      }
      .btn-login:hover {
        background: #1d4ed8;
      }
      .btn-login:disabled {
        background: #94a3b8;
        cursor: not-allowed;
      }
      .footer {
        text-align: center;
        font-size: 11px;
        color: #94a3b8;
        margin-top: 24px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">
        <div class="logo-icon"><i class="fas fa-utensils"></i></div>
        <div class="logo-text">
          <h1>MJCC Inventory</h1>
          <p>Miami Job Corps Cafeteria</p>
        </div>
      </div>

      <div class="expired-banner" id="expired-banner">
        <i class="fas fa-clock"></i> Your session expired. Please sign in again.
      </div>

      <div class="type-tabs">
        <button class="type-btn" onclick="setType('staff')" id="btn-staff">
          <i class="fas fa-id-badge"></i> Staff
        </button>
        <button class="type-btn" onclick="setType('admin')" id="btn-admin">
          <i class="fas fa-key"></i> Admin / Manager
        </button>
      </div>

      <div id="error-msg" class="error-msg"></div>

      <div class="field">
        <label>Username</label>
        <input type="text" id="inp-username" placeholder="Enter username" autocomplete="username" />
      </div>
      <div id="field-pin" class="field">
        <label>PIN</label>
        <input
          type="password"
          id="inp-pin"
          placeholder="4-digit PIN"
          maxlength="4"
          inputmode="numeric"
          autocomplete="current-password"
        />
      </div>
      <div id="field-password" class="field" style="display: none">
        <label>Password</label>
        <input
          type="password"
          id="inp-password"
          placeholder="Enter password"
          autocomplete="current-password"
        />
      </div>

      <button class="btn-login" id="btn-login" onclick="doLogin()">Sign In →</button>
      <div class="footer">Food Service Division · Miami Job Corps Cafeteria</div>
    </div>

    <script>
      let loginType = 'staff';

      function setType(t) {
        loginType = t;
        document.getElementById('btn-staff').classList.toggle('active', t === 'staff');
        document.getElementById('btn-admin').classList.toggle('active', t === 'admin');
        document.getElementById('field-pin').style.display = t === 'staff' ? 'block' : 'none';
        document.getElementById('field-password').style.display = t === 'staff' ? 'none' : 'block';
        clearError();
      }

      function clearError() {
        const el = document.getElementById('error-msg');
        el.style.display = 'none';
        el.textContent = '';
      }

      function showError(msg) {
        const el = document.getElementById('error-msg');
        el.textContent = msg;
        el.style.display = 'block';
      }

      async function doLogin() {
        clearError();
        const btn = document.getElementById('btn-login');
        const username = document.getElementById('inp-username').value.trim();
        if (!username) {
          showError('Please enter your username.');
          return;
        }

        const payload = { username, type: loginType };
        if (loginType === 'staff') {
          const pin = document.getElementById('inp-pin').value.trim();
          if (!pin) {
            showError('Please enter your PIN.');
            return;
          }
          payload.pin = pin;
        } else {
          const password = document.getElementById('inp-password').value;
          if (!password) {
            showError('Please enter your password.');
            return;
          }
          payload.password = password;
        }

        btn.disabled = true;
        btn.textContent = 'Signing in…';
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          if (!res.ok) {
            showError(data.error || 'Login failed.');
            return;
          }
          window.location.href = '/app';
        } catch {
          showError('Could not connect to server. Please try again.');
        } finally {
          btn.disabled = false;
          btn.textContent = 'Sign In →';
        }
      }

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') doLogin();
      });

      if (new URLSearchParams(window.location.search).get('expired') === '1')
        document.getElementById('expired-banner').style.display = 'block';

      setType('staff');
    </script>
  </body>
</html>
