<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pull Sheet — MJC Cafeteria</title>
    <link rel="icon" type="image/svg+xml" href="/logo-shield.svg" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #0f1e35;
        color: #e2e8f0;
        min-height: 100vh;
      }
      nav {
        background: #1a2f4a;
        padding: 0 1.5rem;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .nav-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .nav-logo {
        width: 32px;
        height: 32px;
        border-radius: 6px;
        overflow: hidden;
        flex-shrink: 0;
      }
      .nav-logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .nav-title {
        font-size: 15px;
        font-weight: 700;
      }
      .nav-title span {
        color: #8ab4f8;
        font-weight: 400;
        font-size: 12px;
      }
      .nav-right {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .btn {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #e2e8f0;
        padding: 6px 14px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        font-family: inherit;
        text-decoration: none;
      }
      .btn:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      .btn-primary {
        background: #2563eb;
        border-color: #2563eb;
        color: #fff;
      }
      .btn-primary:hover {
        background: #1d4ed8;
      }
      main {
        flex: 1;
        padding: 1.5rem;
        max-width: 1200px;
        margin: 0 auto;
      }
      .controls {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        background: #1a2f4a;
        border-radius: 10px;
        padding: 14px 18px;
        margin-bottom: 16px;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      .controls select {
        background: #0f1e35;
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: #e2e8f0;
        padding: 6px 10px;
        border-radius: 6px;
        font-size: 12px;
        font-family: inherit;
      }
      .stats-bar {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 10px;
        margin-bottom: 16px;
      }
      .stat-card {
        background: #1a2f4a;
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 8px;
        padding: 12px 14px;
        text-align: center;
      }
      .stat-card .lbl {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: rgba(255, 255, 255, 0.45);
        font-weight: 600;
        margin-bottom: 4px;
      }
      .stat-card .val {
        font-size: 20px;
        font-weight: 700;
        font-family: 'Courier New', monospace;
      }
      .stat-card.accent .val {
        color: #fbbf24;
      }
      .stat-card.green .val {
        color: #34d399;
      }
      .stat-card.red .val {
        color: #f87171;
      }
      .stat-card.blue .val {
        color: #60a5fa;
      }
      .tbl-wrap {
        overflow-x: auto;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.07);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      thead th {
        background: #1a2f4a;
        color: rgba(255, 255, 255, 0.55);
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 9px 10px;
        text-align: right;
        white-space: nowrap;
      }
      thead th:first-child {
        text-align: left;
      }
      tbody tr {
        border-top: 1px solid rgba(255, 255, 255, 0.05);
      }
      tbody tr:hover {
        background: rgba(138, 180, 248, 0.05);
      }
      tbody td {
        padding: 8px 10px;
        text-align: right;
        white-space: nowrap;
      }
      tbody td:first-child {
        text-align: left;
        font-family: 'Segoe UI', Arial, sans-serif;
      }
      .qty-cell {
        font-family: 'Courier New', monospace;
        font-weight: 700;
      }
      .on-hand {
        color: #fbbf24;
      }
      .shortage {
        color: #f87171;
      }
      .cost {
        color: #34d399;
      }
      .ok {
        color: #6ee7b7;
      }
      .critical {
        color: #f87171;
        font-weight: 700;
      }
      .badge {
        display: inline-block;
        padding: 2px 7px;
        border-radius: 4px;
        font-size: 10px;
        font-weight: 700;
      }
      .badge.cat {
        background: #2d4a6f;
        color: #8ab4f8;
      }
      .cat-row td {
        background: #162236;
        color: #8ab4f8;
        font-size: 11px;
        font-weight: 700;
        text-align: left;
        padding: 6px 10px;
        cursor: pointer;
        border-top: 2px solid rgba(138, 180, 248, 0.15);
      }
      .cat-row td span {
        float: right;
        color: rgba(255, 255, 255, 0.4);
        font-size: 10px;
        font-family: 'Courier New', monospace;
      }
      .empty {
        text-align: center;
        padding: 60px 20px;
        color: rgba(255, 255, 255, 0.3);
        font-size: 13px;
      }
      .spinner-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 200px;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(138, 180, 248, 0.2);
        border-top-color: #8ab4f8;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #toast {
        position: fixed;
        bottom: 24px;
        right: 24px;
        padding: 12px 20px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        color: #fff;
        z-index: 9999;
        opacity: 0;
        transform: translateY(10px);
        transition: 0.25s;
        pointer-events: none;
        max-width: 340px;
      }
      #toast.show {
        opacity: 1;
        transform: translateY(0);
      }
      #toast.success {
        background: #065f46;
        border: 1px solid #059669;
      }
      #toast.error {
        background: #7f1d1d;
        border: 1px solid #dc2626;
      }

      @media print {
        nav,
        .controls,
        .no-print {
          display: none !important;
        }
        body {
          background: white !important;
          color: #1e293b !important;
        }
        .stat-card {
          background: #f8fafc !important;
          border-color: #e2e8f0 !important;
        }
        thead th {
          background: #1e3a6e !important;
          color: white !important;
        }
        .cat-row td {
          background: #f1f5f9 !important;
          color: #1e3a6e !important;
        }
        tbody td {
          color: #1e293b !important;
        }
        main {
          padding: 0.5in;
        }
      }
    </style>
  </head>
  <body>
    <div
      style="
        background: #fef3c7;
        border-bottom: 2px solid #f59e0b;
        padding: 8px 16px;
        text-align: center;
        font-size: 13px;
        font-weight: 600;
        color: #92400e;
      "
    >
      ⚠️ This page has moved. <a href="/app" style="color: #1d4ed8">Go to the new app</a>
    </div>
    <nav>
      <div class="nav-left">
        <div class="nav-logo"><img src="/logo-shield.svg" alt="MJC Shield" /></div>
        <div class="nav-title">MJC Cafeteria <span>Pull Sheet</span></div>
      </div>
      <div class="nav-right">
        <span id="nav-user" style="font-size: 12px; color: #94a3b8"></span>
        <a href="/dashboard-admin" class="btn">⬅ Admin</a>
        <button class="btn" id="logoutBtn">Logout</button>
      </div>
    </nav>
    <main>
      <div class="controls">
        <div style="font-weight: 700; font-size: 14px; margin-right: 8px">📝 Pull Sheet</div>
        <select id="sel-month"></select>
        <select id="sel-year"></select>
        <select id="sel-category" style="flex: 1; max-width: 200px">
          <option value="">All Categories</option>
        </select>
        <button class="btn btn-primary no-print" onclick="window.print()">🖨 Print</button>
      </div>

      <div class="stats-bar" id="stats-bar">
        <div class="stat-card blue">
          <div class="lbl">Items Below Par</div>
          <div class="val" id="st-reorder">—</div>
        </div>
        <div class="stat-card red">
          <div class="lbl">Total Shortage (units)</div>
          <div class="val" id="st-shortage">—</div>
        </div>
        <div class="stat-card accent">
          <div class="lbl">Est. Reorder Cost</div>
          <div class="val" id="st-cost">—</div>
        </div>
        <div class="stat-card green">
          <div class="lbl">Items OK</div>
          <div class="val" id="st-ok">—</div>
        </div>
      </div>

      <div class="spinner-wrap" id="spinner"><div class="spinner"></div></div>
      <div class="tbl-wrap" id="tbl-wrap" style="display: none">
        <table>
          <thead>
            <tr>
              <th style="text-align: left">Item</th>
              <th style="text-align: left">SKU</th>
              <th style="text-align: left">Category</th>
              <th>On Hand</th>
              <th>Par Level</th>
              <th>Shortage</th>
              <th>Unit Price</th>
              <th>Reorder Cost</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="empty" id="empty" style="display: none">
        ✅ All items are at or above par level — no reorder needed!
      </div>
    </main>
    <div id="toast"></div>

    <script>
      let currentMonth = new Date().getMonth();
      let currentYear = new Date().getFullYear();
      let allItems = [];
      let currentRole = null;

      const $ = (id) => document.getElementById(id);
      const fmt$ = (n) => (n == null ? '—' : '$' + Number(n).toFixed(2));
      const fmtN = (n) => (n == null ? '—' : Number(n).toFixed(0));
      const escH = (s) =>
        String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');

      function showToast(msg, type = 'success') {
        const t = $('toast');
        t.textContent = msg;
        t.className = 'show ' + type;
        clearTimeout(t._tid);
        t._tid = setTimeout(() => {
          t.className = '';
        }, 3500);
      }

      (async function init() {
        try {
          const r = await fetch('/api/auth/me', { credentials: 'include' });
          if (!r.ok) {
            window.location.replace('/');
            return;
          }
          const d = await r.json();
          if (!d.authenticated) {
            window.location.replace('/');
            return;
          }
          currentRole = d.user.role;
          $('nav-user').textContent = '👤 ' + (d.user.display_name || d.user.username);
        } catch {
          window.location.replace('/');
          return;
        }

        // Month selector
        const mSel = $('sel-month');
        const months = [
          'Jan',
          'Feb',
          'Mar',
          'Apr',
          'May',
          'Jun',
          'Jul',
          'Aug',
          'Sep',
          'Oct',
          'Nov',
          'Dec',
        ];
        months.forEach((m, i) => {
          const o = document.createElement('option');
          o.value = i;
          o.textContent = m;
          if (i === currentMonth) o.selected = true;
          mSel.appendChild(o);
        });
        const ySel = $('sel-year');
        const nowY = new Date().getFullYear();
        for (let y = nowY - 2; y <= nowY + 1; y++) {
          const o = document.createElement('option');
          o.value = y;
          o.textContent = y;
          if (y === currentYear) o.selected = true;
          ySel.appendChild(o);
        }

        mSel.onchange = () => {
          currentMonth = parseInt(mSel.value);
          loadData();
        };
        ySel.onchange = () => {
          currentYear = parseInt(ySel.value);
          loadData();
        };

        $('logoutBtn').addEventListener('click', async () => {
          await fetch('/api/auth/logout', { method: 'POST' });
          window.location.href = '/';
        });

        await loadData();
      })();

      async function loadData() {
        $('spinner').style.display = 'flex';
        $('tbl-wrap').style.display = 'none';
        $('empty').style.display = 'none';
        try {
          const r = await fetch(
            `/api/inventory/items?month=${currentMonth}&year=${currentYear}&per_page=500`,
            { credentials: 'include' },
          );
          if (!r.ok) {
            showToast('Failed to load data', 'error');
            $('spinner').style.display = 'none';
            return;
          }
          const d = await r.json();
          allItems = d.items || [];
          renderTable();
        } catch {
          showToast('Network error', 'error');
          $('spinner').style.display = 'none';
        }
      }

      function renderTable() {
        $('spinner').style.display = 'none';
        const catSel = $('sel-category');
        const cats = [...new Set(allItems.map((i) => i.category || 'Uncategorized'))].sort();

        // Populate category filter (first time)
        if (catSel.options.length <= 1) {
          cats.forEach((c) => {
            const o = document.createElement('option');
            o.value = c;
            o.textContent = c;
            catSel.appendChild(o);
          });
          catSel.onchange = renderTable;
        }

        const filterCat = catSel.value;
        let items = allItems;
        if (filterCat) items = items.filter((i) => (i.category || 'Uncategorized') === filterCat);

        // Filter below par
        const reorderItems = items.filter((i) => (i.on_hand || 0) < (i.par_level || 0));
        reorderItems.sort(
          (a, b) => (a.on_hand || 0) / (a.par_level || 1) - (b.on_hand || 0) / (b.par_level || 1),
        );

        const okItems = items.filter((i) => (i.on_hand || 0) >= (i.par_level || 0));

        // Stats
        const totalShortage = reorderItems.reduce(
          (s, i) => s + Math.max(0, (i.par_level || 0) - (i.on_hand || 0)),
          0,
        );
        const totalReorderCost = reorderItems.reduce(
          (s, i) => s + Math.max(0, (i.par_level || 0) - (i.on_hand || 0)) * (i.unit_price || 0),
          0,
        );
        $('st-reorder').textContent = reorderItems.length;
        $('st-shortage').textContent = fmtN(totalShortage);
        $('st-cost').textContent = fmt$(totalReorderCost);
        $('st-ok').textContent = okItems.length;

        const tbody = $('tbody');
        tbody.innerHTML = '';

        if (!reorderItems.length) {
          $('tbl-wrap').style.display = 'none';
          $('empty').style.display = 'block';
          return;
        }

        $('tbl-wrap').style.display = 'block';
        $('empty').style.display = 'none';

        // Group by category
        const groups = {};
        reorderItems.forEach((it) => {
          const cat = it.category || 'Uncategorized';
          if (!groups[cat]) groups[cat] = [];
          groups[cat].push(it);
        });

        Object.entries(groups).forEach(([cat, catItems]) => {
          const catShortage = catItems.reduce(
            (s, i) => s + Math.max(0, (i.par_level || 0) - (i.on_hand || 0)),
            0,
          );
          const hdr = document.createElement('tr');
          hdr.className = 'cat-row';
          hdr.innerHTML = `<td colspan="9">▼ ${escH(cat)}<span>${catItems.length} items · ${fmtN(
            catShortage,
          )} units short</span></td>`;
          tbody.appendChild(hdr);

          catItems.forEach((it) => {
            const oh = it.on_hand || 0;
            const par = it.par_level || 0;
            const shortage = Math.max(0, par - oh);
            const cost = shortage * (it.unit_price || 0);
            const pct = par > 0 ? (oh / par) * 100 : 100;
            const isCritical = oh <= 0;

            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td style="font-weight:${isCritical ? 700 : 400}">${isCritical ? '⚠️ ' : ''}${escH(
                it.description || '',
              )}</td>
              <td style="color:rgba(255,255,255,.45);font-size:11px;font-family:'Courier New',monospace">${escH(
                it.sku || '',
              )}</td>
              <td><span class="badge cat">${escH(cat)}</span></td>
              <td class="qty-cell on-hand">${fmtN(oh)}${pct <= 25 ? ' ⚠️' : ''}</td>
              <td class="qty-cell">${fmtN(par)}</td>
              <td class="qty-cell shortage">+${fmtN(shortage)}</td>
              <td class="cost">${fmt$(it.unit_price)}</td>
              <td class="cost" style="font-weight:700">${fmt$(cost)}</td>
              <td>${
                isCritical
                  ? '<span class="critical">CRITICAL</span>'
                  : '<span class="ok">Reorder</span>'
              }</td>
            `;
            tbody.appendChild(tr);
          });
        });
      }
    </script>
    <script>
      setTimeout(function () {
        window.location.href = '/app';
      }, 3000);
    </script>
  </body>
</html>
