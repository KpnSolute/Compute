name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Lint with ruff
        run: ruff check backend/ tests/

      - name: Test with pytest
        run: pytest

  deploy:
    name: Deploy to Azure
    needs: lint-and-test
    runs-on: ubuntu-latest
    # Only deploy on push to main (not PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Required GitHub secrets:
    #   AZURE_CREDENTIALS  — service principal JSON (az ad sp create-for-rbac output)
    #   ACR_USERNAME       — ACR admin username (kpncloud)
    #   ACR_PASSWORD       — ACR admin password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: kpncloud.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker image
        run: docker build -t kpncloud.azurecr.io/mjcc-api:latest .

      - name: Push Docker image to ACR
        run: docker push kpncloud.azurecr.io/mjcc-api:latest

      - name: Deploy image to App Service
        run: |
          az webapp config container set \
            --name mjcc-api \
            --resource-group jeremiah-rg \
            --docker-custom-image-name kpncloud.azurecr.io/mjcc-api:latest \
            --docker-registry-server-url https://kpncloud.azurecr.io \
            --docker-registry-server-user ${{ secrets.ACR_USERNAME }} \
            --docker-registry-server-password ${{ secrets.ACR_PASSWORD }}

      - name: Configure App Service port
        run: |
          az webapp config appsettings set \
            --name mjcc-api \
            --resource-group jeremiah-rg \
            --settings WEBSITES_PORT=5000
