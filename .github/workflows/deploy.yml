name: Verify and Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Full release gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run the shared release gate
        run: python scripts/verify_release.py

  release:
    name: Tag and publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate version policy
        id: version
        run: python scripts/verify_release.py --version-only

      - name: Ensure version has not already shipped
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            tagged_sha="$(git rev-list -n 1 "v${VERSION}")"
            echo "v${VERSION} already exists on ${tagged_sha}. Bump VERSION before merging or rerunning release." >&2
            exit 1
          fi

      - name: Create annotated Git tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "MJCC ${CHANNEL} v${VERSION}"
          git push origin "v${VERSION}"

      - name: Publish GitHub prerelease
        if: steps.version.outputs.channel == 'prerelease'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v${VERSION}" --verify-tag --generate-notes --prerelease --title "MJCC v${VERSION}"

      - name: Publish GitHub release
        if: steps.version.outputs.channel == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v${VERSION}" --verify-tag --generate-notes --latest=false --title "MJCC v${VERSION}"

      - name: Publish stable GitHub release
        if: steps.version.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v${VERSION}" --verify-tag --generate-notes --latest --title "MJCC v${VERSION}"
